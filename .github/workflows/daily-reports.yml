name: Daily Hathway Reports
run-name: Daily Hathway Report ${{ inputs.report_type || 'expiry' }}
on:
  workflow_dispatch:
    inputs:
      report_type:
        description: Read-only report from account 1
        type: choice
        options: [expiry, renewals, weekly]
        default: expiry
        required: true
      report_date:
        description: Optional YYYY-MM-DD; blank uses current India date
        type: string
        required: false
      send_telegram:
        description: Send report to the configured owner chat
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hathway-daily-reports
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPORT_TYPE: ${{ inputs.report_type || 'expiry' }}
      REPORT_DATE: ${{ inputs.report_date }}
      REPORT_SEND_TELEGRAM: ${{ inputs.send_telegram }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing Python dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium and Tesseract
        timeout-minutes: 13
        run: |
          # Bound apt operations used by Playwright's dependency installer too.
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80hathway-timeouts >/dev/null
          timeout 180s sudo apt-get update -qq
          timeout 180s sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          timeout 180s python -m playwright install-deps chromium
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=60000 timeout 180s python -m playwright install chromium
      - name: Read account 1 report (no renewal actions)
        timeout-minutes: 9
        env:
          HATHWAY_USERNAME: ${{ secrets.HATHWAY_USERNAME }}
          HATHWAY_PASSWORD: ${{ secrets.HATHWAY_PASSWORD }}
        run: python daily_reports.py collect
      - name: Send report or failure notice to owner
        timeout-minutes: 2
        if: always()
        env:
          TELEGRAM_REPORT_CHAT_ID: ${{ vars.TELEGRAM_REPORT_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python daily_reports.py notify
