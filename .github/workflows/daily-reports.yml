name: Daily Hathway Reports
run-name: Daily Hathway Report ${{ inputs.report_type || 'expiry' }}
on:
  workflow_dispatch:
    inputs:
      report_type:
        description: Read-only report from account 1
        type: choice
        options: [expiry, renewals, weekly]
        default: expiry
        required: true
      report_date:
        description: Optional YYYY-MM-DD; blank uses current India date
        type: string
        required: false
      send_telegram:
        description: Send report to the configured owner chat
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hathway-daily-reports
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPORT_TYPE: ${{ inputs.report_type || 'expiry' }}
      REPORT_DATE: ${{ inputs.report_date }}
      REPORT_SEND_TELEGRAM: ${{ inputs.send_telegram }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing Python dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium and Tesseract
        timeout-minutes: 8
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Read account 1 report (no renewal actions)
        timeout-minutes: 9
        env:
          HATHWAY_USERNAME: ${{ secrets.HATHWAY_USERNAME }}
          HATHWAY_PASSWORD: ${{ secrets.HATHWAY_PASSWORD }}
        run: python daily_reports.py collect
      - name: Send report or failure notice to owner
        timeout-minutes: 2
        if: always()
        env:
          TELEGRAM_REPORT_CHAT_ID: ${{ vars.TELEGRAM_REPORT_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python daily_reports.py notify
