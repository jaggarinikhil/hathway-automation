name: Hathway Renewal
run-name: Hathway Renewal ${{ inputs.telegram_request_id }}

on:
  workflow_dispatch:
    inputs:
      box_number:
        description: "Hathway STB box number (e.g. N71716815999)"
        required: true
        type: string

      retrack_only:
        description: "Only Retrack this box; never submit renewal"
        required: false
        default: false
        type: boolean

      renew_expired_once:
        description: "One-off authorization to renew this expired box (default off)"
        required: false
        default: false
        type: boolean

      telegram_enabled:
        description: "Enable Telegram completion (normally set by Worker)"
        required: false
        default: false
        type: boolean
      telegram_chat_id:
        required: false
        type: string
      telegram_request_id:
        required: false
        type: string

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium + OS deps
        run: python -m playwright install --with-deps chromium

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr

      - name: Verify tools
        run: |
          python -c "import playwright; print('playwright ok')"
          python -c "import pytesseract; print('pytesseract ok')"
          tesseract --version | head -1

      - name: Run renewal
        if: ${{ !inputs.telegram_enabled }}
        env:
          HATHWAY_USERNAME: ${{ secrets.HATHWAY_USERNAME }}
          HATHWAY_PASSWORD: ${{ secrets.HATHWAY_PASSWORD }}
          HATHWAY_USERNAME_2: ${{ secrets.HATHWAY_USERNAME_2 }}
          HATHWAY_PASSWORD_2: ${{ secrets.HATHWAY_PASSWORD_2 }}
          HATHWAY_BOX_NUMBER: ${{ inputs.box_number }}
          HATHWAY_RENEW_EXPIRED_ONCE: ${{ inputs.renew_expired_once }}
          HATHWAY_RENEW_EXPIRED_BOX: ${{ inputs.box_number }}
          HATHWAY_RETRACK_ONLY: ${{ inputs.retrack_only }}
          HATHWAY_RETRACK_BOX: ${{ inputs.box_number }}
        run: python run_gha.py

      - name: Run existing renewal for Telegram
        id: telegram_renewal
        if: inputs.telegram_enabled
        env:
          HATHWAY_USERNAME: ${{ secrets.HATHWAY_USERNAME }}
          HATHWAY_PASSWORD: ${{ secrets.HATHWAY_PASSWORD }}
          HATHWAY_USERNAME_2: ${{ secrets.HATHWAY_USERNAME_2 }}
          HATHWAY_PASSWORD_2: ${{ secrets.HATHWAY_PASSWORD_2 }}
          HATHWAY_BOX_NUMBER: ${{ inputs.box_number }}
        run: python telegram_run.py

      - name: Notify Telegram
        if: ${{ always() && inputs.telegram_enabled }}
        env:
          TELEGRAM_ENABLED: 'true'
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_REQUEST_ID: ${{ inputs.telegram_request_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WORKER_URL: ${{ vars.TELEGRAM_WORKER_URL }}
          RESULT_CALLBACK_SECRET: ${{ secrets.RESULT_CALLBACK_SECRET }}
        run: python telegram_notify.py
