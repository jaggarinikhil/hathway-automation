name: RVR group monitor
on:
  schedule:
    # UTC = IST minus 5:30. Daily 06:00 through 12:00 noon IST.
    - cron: '30,40,50 0 * * *'
    - cron: '*/10 1-5 * * *'
    - cron: '0,10,20,30 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only validation at any time; no notifications or state changes
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: rvr-group-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.RVR_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: rvr_monitor/requirements.txt
      - run: pip install -r rvr_monitor/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read RVR and send threshold alerts only
        env:
          RVR_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          RVR_USERNAME: ${{ secrets.RVR_USERNAME }}
          RVR_PASSWORD: ${{ secrets.RVR_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m rvr_monitor.monitor
