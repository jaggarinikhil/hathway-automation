name: RVR ntfy delivery test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one explicitly requested test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 - <<'PYTHON'
          import os, re, sys
          from urllib.request import Request, urlopen
          topic = os.environ.get("NTFY_TOPIC", "")
          if not re.fullmatch(r"[A-Za-z0-9_-]{24,64}", topic):
              print("Topic must contain 24-64 letters, numbers, underscores or hyphens; use only the topic name.")
              sys.exit(1)
          request = Request("https://ntfy.sh/" + topic,
              data=b"This is your requested RVR notification delivery test. This is not a confirmed outage alert.",
              headers={"Title": "RVR notification TEST", "Priority": "high"}, method="POST")
          try:
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError("Not accepted")
              print("ntfy accepted the test notification. Confirm receipt on your phone.")
          except Exception as exc:
              print("Delivery failed: " + type(exc).__name__)
              sys.exit(1)
          PYTHON
